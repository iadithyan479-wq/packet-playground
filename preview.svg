<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="24" fill="#10131d"/><text x="60" y="72" fill="#62e5d2" font-family="Arial" font-size="15" font-weight="bold" letter-spacing="3">THE WEB, ONE HOP AT A TIME</text><text x="60" y="132" fill="#eef2ff" font-family="Arial" font-size="48" font-weight="bold">Follow the request.</text><rect x="60" y="170" width="690" height="260" rx="18" fill="#181d2a" stroke="#30384c"/><path d="M170 290H640" stroke="#65728c" stroke-dasharray="6 8"/><g font-family="Arial" text-anchor="middle"><g fill="#202638" stroke="#62e5d2"><rect x="120" y="245" width="72" height="72" rx="18"/></g><text x="156" y="290" font-size="25" fill="#62e5d2">⌕</text><text x="156" y="345" font-size="15" fill="#eef2ff">DNS</text><rect x="270" y="245" width="72" height="72" rx="18" fill="#202638" stroke="#aa91ff"/><text x="306" y="290" font-size="25" fill="#aa91ff">↔</text><text x="306" y="345" font-size="15" fill="#eef2ff">TCP</text><rect x="420" y="245" width="72" height="72" rx="18" fill="#202638" stroke="#ffb86b"/><text x="456" y="290" font-size="25" fill="#ffb86b">♧</text><text x="456" y="345" font-size="15" fill="#eef2ff">TLS</text><rect x="570" y="245" width="72" height="72" rx="18" fill="#202638" stroke="#82e6a6"/><text x="606" y="290" font-size="25" fill="#82e6a6">⇄</text><text x="606" y="345" font-size="15" fill="#eef2ff">HTTP</text></g><rect x="790" y="170" width="250" height="260" rx="18" fill="#181d2a" stroke="#30384c"/><text x="820" y="215" fill="#62e5d2" font-family="Arial" font-size="13" font-weight="bold">STEP 01 · DNS</text><text x="820" y="260" fill="#eef2ff" font-family="Arial" font-size="24" font-weight="bold">First, find</text><text x="820" y="290" fill="#eef2ff" font-family="Arial" font-size="24" font-weight="bold">the address.</text><text x="820" y="335" fill="#9aa5bc" font-family="Arial" font-size="14">A visual, interactive explainer</text><text x="820" y="357" fill="#9a